# VoiceAPI – Einstellungen (keine Befehle; Plugins wie NoteAPI nutzen die Schnittstelle)

speech:
  # Sprechtempo (1 = normal, 0.8 langsamer, 1.3 schneller)
  rate: 1.0
  # Grundlautstärke aller Stimmen (0–1)
  volume: 1.0
  # Klang-Kategorie, über die Spieler die Sprache regeln: VOICE (Regler „Stimme/Sprache“), RECORDS, PLAYERS, NEUTRAL, MASTER
  category: VOICE

pack:
  # Spieler mit dem NoteAPI-Ressourcenpaket (das die VoiceAPI-Laute enthält) hören echte Vokale und Konsonanten statt Dorfbewohner-Lauten
  use: true
  # Wo das NoteAPI-Paket liegt (leer = plugins/NoteAPI/pack/NoteAPI-Sounds.zip); daraus liest VoiceAPI, ob die Laute enthalten sind
  file: ""
