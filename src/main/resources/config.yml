# VoiceAPI – settings (no commands; plugins like NoteAPI use the API)

speech:
  # speaking rate (1 = normal, 0.8 slower, 1.3 faster)
  rate: 1.0
  # base volume of all voices (0–1)
  volume: 1.0
  # sound category players control the speech with: VOICE (slider "Voice/Speech"), RECORDS, PLAYERS, NEUTRAL, MASTER
  category: VOICE
  # speech only with the resource pack (players without the pack hear nothing; the integrating plugin enforces the pack, VoiceApi.needsPack).
  # false = speak with villager and block sounds without the pack (fallback, sounds rough).
  require-pack: true

sing:
  # singing only with the resource pack: with vanilla sounds the villager does not hit the notes (its hum is only stable for a moment, the
  # game randomly picks one of three takes). Players without the pack then hear no singing; the integrating plugin should enforce the pack
  # (VoiceApi.needsPack). false = sing with vanilla sounds anyway (sounds off-key).
  require-pack: true

rvc:
  # villager singing from the AI voice model (RVC, CPU only – also on Linux servers without a graphics card). Set up:
  #   python plugins/VoiceAPI/tools/rvc_setup.py --model villager.pth
  # folder of the environment (empty = ~/.voiceapi/rvc: venv, Applio, models)
  home: ""
  # name of the model in <home>/models/<model>.pth
  model: villager
  # continue conversions a server stop interrupted (on the next start, in the background)
  resume: true
  # Optional: carry the singer's timbre movement over to the villager (vowel and brightness changes). Off by default (strength 0).
  # More strength = livelier and easier to understand, but a little less "villager". Applies to songs converted afterwards.
  timbre-follow:
    # 0 = off … 1 = fully; 0.3 moves like the villager videos (measured: 2.80/3.14 vs. video 2.90/3.21)
    strength: 0.0
    # limit per frequency band (dB)
    max-db: 6.0
    # what counts as movement: changes against the average of this many milliseconds
    window-ms: 400
    # smoothing of the movement (ms)
    smooth-ms: 40
  # The villager speaks spoken recordings (VoiceApi.convertSpeech – voice lines, speeches, old radio recordings; not songs).
  # Noise is detected first (the quietest moments give the noise profile) and filtered; clean recordings are left alone.
  speech:
    # noise filter strength: 0 = off … 1 = strong
    denoise: 1.0
    # close the pauses: what the model still made of noise this many dB under the speech is lowered (0 = off)
    gate: 24
    # separate the voice from the background with Demucs first: auto = if installed, on, off
    separate: auto

pack:
  # players with the NoteAPI resource pack (which contains the VoiceAPI sounds) hear real vowels and consonants instead of villager sounds
  use: true
  # where the NoteAPI pack is (empty = plugins/NoteAPI/pack/NoteAPI-Sounds.zip); VoiceAPI reads from it whether the sounds are included
  file: ""
  # The sounds are not inside the jar (it stays small): on the first start VoiceAPI downloads them once in the background from the GitHub
  # release "voice-pack", checks the SHA-256 and keeps them at plugins/VoiceAPI/pack/VoiceAPI-Sounds-base.zip. Until then (or without
  # internet) it runs without resource pack. Offline: download the file from https://github.com/Passimoritz/MC-VillagerVoice/releases/tag/voice-pack
  # yourself, place it there and restart. false = never download (e.g. an own file).
  download: true
  # another address (mirror); {sha} = first 12 characters of the checksum, {sha256} = all of it. Empty = the GitHub release.
  download-url: ""
