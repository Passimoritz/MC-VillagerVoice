<path d="M614.0,180.0 L614.0,246.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="626.0" y="212.0" font-size="12" font-weight="600" text-anchor="start" class="t muted">ja</text>
<path d="M930.0,170.0 Q920.0,262.0 798.0,272.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
