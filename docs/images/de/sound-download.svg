<text x="614.0" y="456.0" font-size="12.5" font-weight="400" text-anchor="middle" class="t muted">das fertige Lautpaket</text>
<path d="M310.0,440.0 L430.0,440.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
