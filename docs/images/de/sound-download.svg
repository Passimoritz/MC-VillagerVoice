<rect x="880.0" y="400.0" width="280.0" height="80.0" rx="12" class="violet-l" />
<text x="1020.0" y="428.9" font-size="15" font-weight="650" text-anchor="middle" class="t ink">onSoundPackChanged</text>
<text x="1020.0" y="447.9" font-size="12.5" font-weight="400" text-anchor="middle" class="t muted">die NoteAPI mischt es in</text>
<text x="1020.0" y="463.5" font-size="12.5" font-weight="400" text-anchor="middle" class="t muted">ihr Ressourcenpaket</text>
<path d="M794.0,440.0 L876.0,440.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
