<text x="513.0" y="133.9" font-size="12.5" font-weight="400" text-anchor="middle" class="t on-dark">RVC on the CPU</text>
<text x="513.0" y="149.5" font-size="12.5" font-weight="400" text-anchor="middle" class="t on-dark">villager_sing.py</text>
<path d="M598.0,126.0 L620.0,126.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="622.0" y="76.0" width="170.0" height="100.0" rx="12" class="panel" stroke-width="1.2"/>
