<path d="M792.0,126.0 L814.0,126.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="816.0" y="76.0" width="170.0" height="100.0" rx="12" class="panel" stroke-width="1.2"/>
<text x="901.0" y="122.7" font-size="15" font-weight="650" text-anchor="middle" class="t ink">Swap in</text>
<text x="901.0" y="141.7" font-size="12.5" font-weight="400" text-anchor="middle" class="t muted">&lt;id&gt;.part → &lt;id&gt;</text>
<path d="M986.0,126.0 L1008.0,126.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1010.0" y="76.0" width="170.0" height="100.0" rx="12" class="violet-l" />
<text x="1095.0" y="114.9" font-size="15" font-weight="650" text-anchor="middle" class="t ink">Sound pack</text>
<text x="1095.0" y="133.9" font-size="12.5" font-weight="400" text-anchor="middle" class="t muted">rewritten +</text>
<text x="1095.0" y="149.5" font-size="12.5" font-weight="400" text-anchor="middle" class="t muted">onSoundPackChanged</text>
<path d="M500.0,180.0 Q330.0,228.0 160.0,180.0" class="line dash" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="40.0" y="254.0" font-size="13" font-weight="600" text-anchor="start" class="t gold">↻  server stopped mid-way? the next start continues (rvc.resume)</text>
<text x="40.0" y="280.0" font-size="13" font-weight="400" text-anchor="start" class="t muted">▶  playback: SongVoice.cues() on NoteAPI's music clock</text>
