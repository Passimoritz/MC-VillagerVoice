<text x="319.0" y="149.5" font-size="12.5" font-weight="400" text-anchor="middle" class="t muted">survives restarts</text>
<path d="M404.0,126.0 L426.0,126.0" class="line" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="428.0" y="76.0" width="170.0" height="100.0" rx="12" class="green" />
