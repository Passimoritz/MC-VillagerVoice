# VoiceAPI – build, test and compatibility, without maintenance:
# - on every push, every PR and every Monday (new Minecraft/server versions are checked by themselves; if something fails, GitHub sends
#   an email)
# - compiles against the oldest supported Spigot API (1.17.1, Java 17) and against the NEWEST Paper and Spigot API
# - starts real servers (oldest and newest Paper version, one version in between, newest Folia, newest Spigot) with the jar and checks
#   that VoiceAPI enables without errors. Versions and the required Java come from the project APIs, nothing is hard-coded.
# - a tag "v<version>" creates a release with the jar
name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build and test (Spigot-API 1.17.1, Java 17)
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          mvn -B -ntp verify -Drevision="${GITHUB_REF_NAME#v}"
        else
          mvn -B -ntp verify
        fi
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: voiceapi
        path: target/voiceapi-*.jar
        if-no-files-found: error
    - name: Release (tag)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" target/voiceapi-*.jar --title "VoiceAPI ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md

  api-latest:
    # the same sources and tests against the newest API – if something disappears or changes, CI notices before the users
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [ paper, spigot ]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Newest ${{ matrix.api }} API
      id: v
      run: echo "version=$(bash ci/latest-api.sh ${{ matrix.api }})" >> "$GITHUB_OUTPUT"
    - name: Build and test against ${{ matrix.api }} ${{ steps.v.outputs.version }}
      run: mvn -B -ntp -P ${{ matrix.api }}-latest -Dbukkit.version="${{ steps.v.outputs.version }}" verify

  server:
    # start real servers: does VoiceAPI load and enable without errors?
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: paper, version: oldest }
          - { project: paper, version: "1.20.4" }
          - { project: paper, version: latest }
          - { project: folia, version: latest }
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: voiceapi
        path: dist
    - name: Resolve version and Java
      id: r
      run: |
        read -r version java < <(python3 ci/smoke.py --project ${{ matrix.project }} --version ${{ matrix.version }} --resolve)
        [ "$java" -lt 17 ] && java=17   # the plugin needs Java 17
        echo "version=$version" >> "$GITHUB_OUTPUT"; echo "java=$java" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-java@v5
      with:
        java-version: ${{ steps.r.outputs.java }}
        distribution: 'temurin'
    - name: ${{ matrix.project }} ${{ steps.r.outputs.version }} (Java ${{ steps.r.outputs.java }}) with VoiceAPI
      run: python3 ci/smoke.py --project ${{ matrix.project }} --version ${{ steps.r.outputs.version }} --jar "dist/voiceapi-*.jar"

  spigot:
    # Spigot has no download API: newest state with BuildTools, then the same smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: voiceapi
        path: dist
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Build Spigot (newest)
      run: |
        mkdir -p bt && cd bt
        curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
        java -jar BuildTools.jar --rev latest --output-dir out > buildtools.log 2>&1 || (tail -50 buildtools.log; exit 1)
        ls out
    - name: Start Spigot with VoiceAPI
      run: python3 ci/smoke.py --server "$(ls bt/out/spigot-*.jar | head -1)" --jar "dist/voiceapi-*.jar"
