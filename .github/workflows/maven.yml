# Baut die VoiceAPI, führt die Tests aus und legt das Jar am Lauf ab; ein Tag "v<Version>" erstellt ein Release mit dem Jar.
name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build and test
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          mvn -B verify -Drevision="${GITHUB_REF_NAME#v}"
        else
          mvn -B verify
        fi
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: voiceapi
        path: target/voiceapi-*.jar
        if-no-files-found: error
    - name: Release (tag)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" target/voiceapi-*.jar --title "VoiceAPI ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
